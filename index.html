<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Unit Converter</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><h1>🔄 Unit Converter</h1><div class="converter"><label>From:</label><input type="number" id="inputValue"/><select id="fromUnit"><option>Celsius</option><option>Fahrenheit</option><option>Kilometer</option><option>Mile</option><option>Kilogram</option><option>Pound</option></select></div><div class="converter"><label>To:</label><input type="text" id="outputValue" readonly/><select id="toUnit"><option>Fahrenheit</option><option>Celsius</option><option>Mile</option><option>Kilometer</option><option>Pound</option><option>Kilogram</option></select></div></div><script src="script.js"></ script></body></html>
